name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Worker types
        run: bun run gen:cf-types

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Generate .dev.vars from ENV_YAML secret
        run: |
          printf '%s' "$ENV_YAML" > .env.yaml
          bun run gen:dev-vars
        env:
          ENV_YAML: ${{ secrets.ENV_YAML }}

      # Email Routing is wired once out-of-band in the Cloudflare dashboard.
      - name: Upload Worker secrets
        run: bunx wrangler secret bulk .dev.vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          wranglerVersion: "4.110.0"
          command: deploy
