name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # wrangler types generates worker-configuration.d.ts, required by typecheck.
      - run: bun run gen:cf-types

      - run: bun run typecheck

      - run: bun run test

      # Push the Worker secrets from GitHub Secrets, then deploy. GitHub Secrets
      # are the single source of truth; DISCORD_WEBHOOK_MAP must be stored as the
      # JSON string the Worker JSON.parses (e.g. {"user1":"https://..."}).
      # Email Routing is still wired once out-of-band in the Cloudflare dashboard.
      # wranglerVersion is pinned to the lockfile's wrangler so CI and local match.
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          wranglerVersion: "4.110.0"
          command: deploy
          secrets: |
            DISCORD_WEBHOOK_MAP
            FORWARD_EMAIL_DOMAIN
        env:
          DISCORD_WEBHOOK_MAP: ${{ secrets.DISCORD_WEBHOOK_MAP }}
          FORWARD_EMAIL_DOMAIN: ${{ secrets.FORWARD_EMAIL_DOMAIN }}
