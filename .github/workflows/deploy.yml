name: Deploy

# Runs only after a push-triggered CI success on main (see the fork guard in the
# job `if`), and checks out that trusted head_sha with persist-credentials: false
# — fork/PR-triggered CI runs cannot reach this job or its secrets.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate .dev.vars from ENV_YAML secret
        run: |
          printf '%s' "$ENV_YAML" > .env.yaml
          bun run gen:dev-vars
        env:
          ENV_YAML: ${{ secrets.ENV_YAML }}

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          wranglerVersion: "4.110.0"
          preCommands: wrangler secret bulk .dev.vars
          command: deploy
