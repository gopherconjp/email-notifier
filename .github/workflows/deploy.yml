name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # wrangler types generates worker-configuration.d.ts, required by typecheck.
      - run: bun run gen:cf-types

      - run: bun run typecheck

      - run: bun run test

      # Secrets (DISCORD_WEBHOOK_MAP / FORWARD_EMAIL_DOMAIN) and Email Routing are
      # provisioned once out-of-band; this deploys code only.
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
