name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # wrangler types generates worker-configuration.d.ts, required by typecheck.
      - run: bun run gen:cf-types

      - run: bun run typecheck

      - run: bun run test

      # Secrets (DISCORD_WEBHOOK_MAP / FORWARD_EMAIL_DOMAIN) and Email Routing are
      # provisioned once out-of-band; this deploys code only.
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
