name: Verify (App)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-app:
    name: Verify (App)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for autofix
        uses: gopherconjp/actions-toolkit/wait-for-workflow@4e79acabd4d513ff3bd0fcf6d94a65a9ff5aee90
        with:
          workflow-id: autofix.yaml
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun environment
        uses: gopherconjp/actions-toolkit/setup-bun@4e79acabd4d513ff3bd0fcf6d94a65a9ff5aee90
      - name: Generate Workers runtime types
        run: bun run gen:cf-types
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
