name: Verify (Actions)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-actions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-actions:
    uses: logica0419-oss/actions-toolkit/.github/workflows/verify-actions.yaml@db11f6a3e98d6c3d75ff55757b670464261a25b1 # main
    permissions:
      contents: read
      checks: write
