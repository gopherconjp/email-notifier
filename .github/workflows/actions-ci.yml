name: Actions CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: actions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1.73.1
        with:
          fail_level: error
      - name: Install ghalint
        run: |
          gh release download -R suzuki-shunsuke/ghalint -p 'ghalint_*_linux_amd64.tar.gz' -O ghalint.tar.gz
          tar -xzf ghalint.tar.gz ghalint
      - name: Run ghalint
        run: ./ghalint run
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
