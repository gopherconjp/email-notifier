# Tool versions for this project, managed by mise (https://mise.jdx.dev).
# Run `mise install` to install the pinned toolchain, then `bun install`.
#
# bun is the package manager and runtime for everything here (dev/build/test
# and the config scripts). node is pinned too because the scripts import
# `node:` builtins and some tooling shells out to it.
[tools]
bun = "1.3.11"
node = "24"
